<div id="app" class="app">
  <div id="bg-a" class="bg"></div>
  <div id="bg-b" class="bg" style="opacity:0"></div>
  <div class="scrim"></div>

  <!-- Yükleme ekranı -->
  <section id="scr-loading" class="screen loading" aria-label="Yükleniyor">
    <div class="col">
      <div class="logo" aria-label="Kelime Avı">
        <div class="logo-tiles" aria-hidden="true"><span>K</span><span>E</span><span>L</span><span>İ</span><span>M</span><span>E</span></div>
        <div class="logo-word" aria-hidden="true">AVI</div>
      </div>
      <div class="load">
        <div class="load-label">YÜKLENİYOR...</div>
        <div class="load-bar"><i id="load-fill"></i></div>
      </div>
    </div>
  </section>

  <!-- Ana ekran -->
  <section id="scr-home" class="screen home out" hidden aria-label="Ana ekran">
    <div class="col">
      <header class="topbar">
        <div class="pill" data-gems><svg aria-hidden="true"><use href="#i-gem"/></svg><span>200</span></div>
        <button class="icon-btn" data-act="settings" aria-label="Ayarlar"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
      </header>
      <div class="logo" aria-label="Kelime Avı">
        <div class="logo-tiles" aria-hidden="true"><span>K</span><span>E</span><span>L</span><span>İ</span><span>M</span><span>E</span></div>
        <div class="logo-word" aria-hidden="true">AVI</div>
      </div>
      <div class="journey" id="home-journey"><b id="home-count">0</b><span>YOLCULUK</span></div>
      <button id="btn-play" class="btn-green">BÖLÜM 1</button>
      <button class="icon-btn corner-bl" data-act="cards" aria-label="Kartlarım"><svg aria-hidden="true"><use href="#i-cards"/></svg></button>
    </div>
  </section>

  <!-- Oyun ekranı -->
  <section id="scr-game" class="screen game out" hidden aria-label="Bölüm">
    <div class="col">
      <header class="topbar">
        <div class="pill" data-gems><svg aria-hidden="true"><use href="#i-gem"/></svg><span>200</span></div>
        <button class="icon-btn" data-act="settings" aria-label="Ayarlar"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
      </header>
      <div class="board-wrap" id="board-wrap"><div class="board" id="board" aria-label="Bulmaca"></div></div>
      <div class="stage" id="stage">
        <div class="praise" id="praise" aria-live="polite"></div>
        <div class="preview" id="preview" aria-live="polite"></div>
        <div class="wheel" id="wheel" aria-label="Harf çemberi: harflerin üzerinde parmağını gezdirerek kelime kur">
          <svg class="wheel-lines" id="wheel-lines" aria-hidden="true"></svg>
          <button class="shuffle" id="btn-shuffle" aria-label="Harfleri karıştır"><svg aria-hidden="true"><use href="#i-shuffle"/></svg></button>
        </div>
        <button class="hint-btn" id="btn-hint" aria-label="İpucu: bir harf aç">
          <svg aria-hidden="true"><use href="#i-bulb"/></svg>
          <span class="price" id="hint-price"><svg aria-hidden="true"><use href="#i-gem"/></svg><span>100</span></span>
          <span class="badge" id="hint-badge" hidden>2</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Bölüm tamamlandı -->
  <section id="scr-complete" class="screen complete out" hidden aria-label="Bölüm tamamlandı">
    <div class="col">
      <header class="topbar">
        <div class="pill" data-gems><svg aria-hidden="true"><use href="#i-gem"/></svg><span>200</span></div>
        <span></span>
      </header>
      <h1>TEBRİKLER!</h1>
      <div class="journey" id="cmp-journey"><b id="cmp-count">1</b><span>YOLCULUK</span></div>
      <div class="bars">
        <div class="bar-row">
          <div class="bar"><i id="gift-fill"></i><span id="gift-text">0/8</span></div>
          <svg class="bar-icon" id="gift-icon" aria-hidden="true"><use href="#i-gift"/></svg>
        </div>
        <div class="bar-title" id="loc-title">KAPADOKYA</div>
        <div class="bar-row">
          <div class="bar"><i id="loc-fill"></i><span id="loc-text">0/4</span></div>
          <div class="card-thumb" id="loc-thumb" aria-hidden="true"></div>
        </div>
      </div>
      <button id="btn-next" class="btn-green">BÖLÜM 2</button>
      <button class="icon-btn corner-bl" data-act="home" aria-label="Ana sayfa"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
    </div>
  </section>

  <!-- Tüm duraklar bitti -->
  <section id="scr-end" class="screen end out" hidden aria-label="Yolculuk tamamlandı">
    <div class="col">
      <div class="logo" aria-hidden="true">
        <div class="logo-tiles"><span>K</span><span>E</span><span>L</span><span>İ</span><span>M</span><span>E</span></div>
        <div class="logo-word">AVI</div>
      </div>
      <h1>Bütün durakları gezdin!</h1>
      <p id="end-text">Sekiz tarihî durağın tüm bölümlerini bitirdin. Yeni duraklar eklenene kadar bölümleri baştan oynayabilirsin.</p>
      <button class="btn-green" id="btn-restart">BAŞTAN OYNA</button>
      <button class="btn-plain" data-act="cards">Kartlarıma bak</button>
    </div>
  </section>

  <div id="tut" class="tut" hidden>
    <div class="tut-box" id="tut-box"><p id="tut-text"></p><button id="tut-ok" hidden>TAMAM</button></div>
    <div class="tut-arrow" id="tut-arrow" hidden aria-hidden="true"><svg><use href="#i-arrow"/></svg></div>
  </div>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" hidden role="status"></div>
</div>

<!-- Simgeler -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gem-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff0e6"/><stop offset="1" stop-color="#0f8f9a"/></linearGradient>
    <linearGradient id="gift-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d74d6"/><stop offset="1" stop-color="#1f4fa3"/></linearGradient>
  </defs>
  <symbol id="i-gem" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="15" fill="#0d1236" opacity="0.35"/>
    <path d="M9 9h14l5 6-12 13L4 15z" fill="url(#gem-a)"/>
    <path d="M9 9l3 6h8l3-6M4 15h24M12 15l4 13 4-13" fill="none" stroke="#e9fffb" stroke-width="1.2" stroke-linejoin="round" opacity="0.85"/>
    <path d="M12 15l4-6 4 6z" fill="#fff" opacity="0.35"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2.5 11.2l1.3 1.5L5 11.7V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.3l1.2 1 1.3-1.5z"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5.5 17l3-4 2 2.5 1.5-1.5 2 3z" fill="currentColor"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3 1 4.2 2.6l2.6 4.8C14.5 16 15.5 17 17.5 17H20M3 17h3.5c2 0 3-1 4-2.4M13.4 9.4C14.5 8 15.5 7 17.5 7H20M17.5 4.5 20.5 7l-3 2.5M17.5 14.5l3 2.5-3 2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.9 1.1.9 1.8V17h5.8v-.9c0-.7.3-1.3.9-1.8A6.5 6.5 0 0 0 12 2.5z" fill="currentColor"/><path d="M9.3 19h5.4M10 21.3h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.5 10.5 12 13l1.5-2.5" fill="none" stroke="#2a2440" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-gift" viewBox="0 0 48 48">
    <rect x="7" y="20" width="34" height="23" rx="3" fill="url(#gift-a)"/>
    <rect x="4" y="13" width="40" height="10" rx="3" fill="#3d74d6"/>
    <rect x="21" y="13" width="6" height="30" fill="#f1b434"/>
    <rect x="4" y="16" width="40" height="4" fill="#f1b434" opacity="0"/>
    <path d="M24 13c-3-6-11-8-12-3-1 4 7 4 12 3zM24 13c3-6 11-8 12-3 1 4-7 4-12 3z" fill="#f1b434" stroke="#c98a12" stroke-width="1.2"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 36 24"><path d="M2 12h26M20 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
