plugins {
    id 'com.android.application'
}

// Reklam kimlikleri android/ads.properties dosyasından okunur
def adProps = new Properties()
file("${rootDir}/ads.properties").withInputStream { adProps.load(it) }

android {
    namespace 'com.kelimeavi.oyun'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kelimeavi.oyun'
        minSdk 26
        targetSdk 36          // Google Play şartı (31 Ağustos 2026'dan beri): Android 16 / API 36
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName '0.3.' + (project.findProperty('versionCode') ?: '1')

        manifestPlaceholders = [admobAppId: adProps.getProperty('admobAppId')]
        buildConfigField 'boolean', 'ADS_ENABLED', adProps.getProperty('adsEnabled', 'true')
        buildConfigField 'String', 'AD_BANNER', "\"${adProps.getProperty('bannerUnitId')}\""
        buildConfigField 'String', 'AD_INTERSTITIAL', "\"${adProps.getProperty('interstitialUnitId')}\""
        buildConfigField 'String', 'AD_REWARDED', "\"${adProps.getProperty('rewardedUnitId')}\""
    }

    buildFeatures {
        buildConfig true
    }

    // ---------- İmza ----------
    // Hiçbir parola bu dosyaya yazılmaz. Öncelik sırası:
    //  1) Yayın (Google Play) anahtarı: android/imza.properties dosyası (örnek: imza.properties.example)
    //     ya da KELIMEAVI_KEYSTORE, KELIMEAVI_KEYSTORE_PASSWORD, KELIMEAVI_KEY_ALIAS, KELIMEAVI_KEY_PASSWORD ortam değişkenleri.
    //  2) Test anahtarı: app/test-imza.properties + app/kelime-avi-test.keystore (yalnızca GitHub deposunda;
    //     kaynak ZIP'ine konmaz). Herkese açık bir anahtardır, Google Play için kullanılamaz.
    //  3) Hiçbiri yoksa: Android'in bu bilgisayarda kendiliğinden oluşturduğu hata ayıklama (debug) anahtarı.
    def uploadProps = new Properties()
    def uploadFile = rootProject.file('imza.properties')
    if (uploadFile.exists()) uploadFile.withInputStream { uploadProps.load(it) }
    def upload = { String key, String env -> uploadProps.getProperty(key) ?: System.getenv(env) }
    def uploadStore = upload('storeFile', 'KELIMEAVI_KEYSTORE')
    def hasUpload = uploadStore != null && !uploadStore.isEmpty()

    def testProps = new Properties()
    def testFile = file('test-imza.properties')
    if (testFile.exists()) testFile.withInputStream { testProps.load(it) }
    def hasTest = testFile.exists() && file(testProps.getProperty('storeFile', 'yok')).exists()

    signingConfigs {
        if (hasUpload) {
            upload {
                storeFile rootProject.file(uploadStore)
                storePassword upload('storePassword', 'KELIMEAVI_KEYSTORE_PASSWORD')
                keyAlias upload('keyAlias', 'KELIMEAVI_KEY_ALIAS')
                keyPassword upload('keyPassword', 'KELIMEAVI_KEY_PASSWORD')
            }
        }
        if (hasTest) {
            test {
                storeFile file(testProps.getProperty('storeFile'))
                storePassword testProps.getProperty('storePassword')
                keyAlias testProps.getProperty('keyAlias')
                keyPassword testProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasUpload ? signingConfigs.upload : (hasTest ? signingConfigs.test : signingConfigs.debug)
        }
        debug {
            if (hasTest) signingConfig signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.10.1'
    // Google Mobile Ads (AdMob) ve kullanıcı izni (UMP) kütüphaneleri
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
